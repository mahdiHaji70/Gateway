<div class="sidebar-container">
  <div class="sidebar-scroll-area">
    <div class="user-profile">
      <img class="user-avatar" src="assets/images/user-avatar.png" alt="" />
      <div class="user-details">
        <span class="welcome-label">Welcome</span>
        <strong class="username">{{ username || 'User' }}</strong>
      </div>
    </div>

    <button type="button" class="sidebar-action dashboard-action" (click)="goToDashboard()">
      <img src="assets/images/dashboard.png" alt="" />
      <span>Dashboard</span>
    </button>

    <nav aria-label="Main navigation">
      <ul class="layout-menu">
        <li class="layout-menuitem" *ngFor="let parent of menuItems; let i = index">
          <ng-container *ngIf="parent.items?.length; else directLink">
            <button
              type="button"
              class="menu-group-toggle"
              [attr.aria-expanded]="isParentOpen(i)"
              [attr.aria-controls]="'menu-group-' + i"
              (click)="toggleParent(i)">
              <span class="menu-item-label">
                <img *ngIf="parent.url" class="icon-image" [src]="parent.url" alt="" />
                <i *ngIf="!parent.url" class="layout-menuitem-icon" [ngClass]="parent.icon || 'pi pi-question'"></i>
                <span>{{ parent.label }}</span>
              </span>
              <i class="pi" [ngClass]="isParentOpen(i) ? 'pi-angle-down' : 'pi-angle-right'" aria-hidden="true"></i>
            </button>

            <ul *ngIf="isParentOpen(i)" class="submenu" [id]="'menu-group-' + i" [@expandCollapse]>
              <li *ngFor="let child of parent.items">
                <button
                  type="button"
                  class="layout-menuitem-link"
                  [class.is-active]="isRouteActive(child['path'])"
                  (click)="onItemClick(child['path'])">
                  <i class="pi pi-circle-fill submenu-bullet" aria-hidden="true"></i>
                  <span class="layout-menuitem-text">{{ child.label }}</span>
                </button>
              </li>
            </ul>
          </ng-container>

          <ng-template #directLink>
            <button
              type="button"
              class="menu-group-toggle direct-menu-link"
              [class.is-active]="isRouteActive(parent['path'])"
              (click)="onItemClick(parent['path'])">
              <span class="menu-item-label">
                <img *ngIf="parent.url" class="icon-image" [src]="parent.url" alt="" />
                <i *ngIf="!parent.url" class="layout-menuitem-icon" [ngClass]="parent.icon || 'pi pi-question'"></i>
                <span>{{ parent.label }}</span>
              </span>
            </button>
          </ng-template>
        </li>
      </ul>
    </nav>
  </div>

  <button type="button" class="sidebar-action support-action" (click)="goToDashboard()">
    <img src="assets/images/support.png" alt="" />
    <span>Support</span>
  </button>
</div>
