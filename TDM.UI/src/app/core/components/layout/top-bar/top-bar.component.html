<div class="layout-topbar">
    <button
        #menubutton
        type="button"
        class="p-link layout-menu-button layout-topbar-button"
        aria-label="Toggle navigation menu"
        aria-controls="primary-navigation"
        [attr.aria-expanded]="layoutService.menuIsOpen"
        (click)="layoutService.onMenuToggle()">
        <i class="pi pi-bars" aria-hidden="true"></i>
    </button>
    <a class="layout-topbar-logo" routerLink="/" aria-label="TDM dashboard">
        <span>TDM</span>
    </a>

    <button
        #topbarmenubutton
        type="button"
        class="p-link layout-topbar-menu-button layout-topbar-button"
        aria-label="Toggle account menu"
        [attr.aria-expanded]="layoutService.state.profileSidebarVisible"
        (click)="layoutService.showProfileSidebar()">
        <i class="pi pi-ellipsis-v" aria-hidden="true"></i>
    </button>

    <div #topbarmenu class="layout-topbar-menu" [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">
        <button
            type="button"
            class="p-link layout-topbar-button language-toggle"
            [attr.aria-label]="(languageService.currentLanguage() === 'en' ? 'language.switchToPersian' : 'language.switchToEnglish') | translate"
            [attr.aria-pressed]="languageService.currentLanguage() === 'fa'"
            (click)="toggleLanguage()">
            <i class="pi pi-globe" aria-hidden="true"></i>
            <span>{{ languageService.currentLanguage() === 'en' ? 'فارسی' : 'English' }}</span>
        </button>
        <button class="p-link layout-topbar-button">
            <i class="pi pi-user"></i>
            <span>{{ 'topbar.profile' | translate }}</span>
        </button>
        <button class="p-link layout-topbar-button" (click)="signOut()">
            <i class="pi pi-sign-out"></i>
            <span>{{ 'topbar.signOut' | translate }}</span>
        </button>
    </div>
</div>
