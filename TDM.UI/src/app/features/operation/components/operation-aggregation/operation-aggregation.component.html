<p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">       
        <p-button severity="info" label="Refresh" icon="pi pi-refresh" class="mr-2" (onClick)="loadOperationAggregations()" />
    </ng-template>

</p-toolbar>
<p-table [value]="operationAggregations" styleClass="p-datatable-gridlines" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
        <tr>
            <th>Declaration</th>
            <th>Last Date</th>            
            <th>Actions</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
        <tr>
            <td>{{ item.number }}</td>
            <td>{{ item.lastDate }}</td>            
            <td>
                <button pButton pRipple type="button" icon="pi pi-arrow-down-left-and-arrow-up-right-to-center" class="p-button-rounded p-button-text"
                    (click)="aggregateDeclaration(item.declarationId)">
                </button>                
            </td>
        </tr>
    </ng-template>
</p-table>
<p-toast />
<p-confirmDialog />
