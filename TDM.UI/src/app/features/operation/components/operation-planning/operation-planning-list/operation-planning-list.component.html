<p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
        <p-button severity="success" label="New" icon="pi pi-plus" class="mr-2" (onClick)="onAdd()" />
        <p-button severity="info" label="Refresh" icon="pi pi-refresh" class="mr-2" (onClick)="loadDischarges()" />
    </ng-template>

</p-toolbar>
<p-table [value]="discharges" styleClass="p-datatable-gridlines" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
        <tr>
            <th>Declaration</th>
            <th>Staff</th>
            <th>Equipment</th>
            <th>EquipmentType</th>
            <th>Shift</th>
            <th>Place</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-plan>
        <tr>
            <td>{{ plan.declarationNumber }}</td>
            <td>{{ plan.staffName }}</td>
            <td>{{ plan.equipmentName }}</td>
            <td>{{ plan.equipmentTypeName }}</td>
            <td>{{ plan.shiftName }}</td>
            <td>{{ plan.placeName }}</td>
            <td>{{ plan.date }}</td>
            <td>
                <button pButton pRipple type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text"
                    (click)="onEdit(plan.id)">
                </button>
                <button pButton pRipple type="button" icon="pi pi-times"
                    class="p-button-rounded p-button-text p-button-danger" (click)="onDelete($event,plan.id)">
                </button>
            </td>
        </tr>
    </ng-template>
</p-table>
<p-toast />
<p-confirmDialog />
