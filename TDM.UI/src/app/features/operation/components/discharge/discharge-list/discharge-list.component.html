<p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
        <p-button severity="success" label="New" icon="pi pi-plus" class="mr-2" (onClick)="onAdd()" />
        <p-button severity="info" label="Refresh" icon="pi pi-refresh" class="mr-2" (onClick)="loadDischarges()" />
    </ng-template>

</p-toolbar>
<p-table [value]="discharges" styleClass="p-datatable-gridlines" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
        <tr>
            <th>Declaration</th>
            <th>Vehicle</th>
            <th>Place</th>
            <th>Container</th>
            <th>Pack Number</th>
            <th>Weight</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-gate>
        <tr>
            <td>{{ gate.declarationNumber }}</td>
            <td>{{ gate.vehicleName }}</td>
            <td>{{ gate.placeName }}</td>
            <td>{{ gate.containerNumber }}</td>
            <td>{{ gate.packNumber }}</td>
            <td>{{ gate.weight }}</td>
            <td>{{ gate.operationDate }}</td>
            <td>
                <button pButton pRipple type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text"
                    (click)="onEdit(gate.id)">
                </button>
                <button pButton pRipple type="button" icon="pi pi-times"
                    class="p-button-rounded p-button-text p-button-danger" (click)="onDelete($event,gate.id)">
                </button>
            </td>
        </tr>
    </ng-template>
</p-table>
<p-toast />
<p-confirmDialog />
