<p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
        <p-button severity="success" label="New" icon="pi pi-plus" class="mr-2" (onClick)="onAdd()" />
        <p-button severity="info" label="Refresh" icon="pi pi-refresh" class="mr-2" (onClick)="loadDischarges()" />
    </ng-template>

</p-toolbar>
<p-table [value]="discharges" styleClass="p-datatable-gridlines" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
        <tr>
            <th>Declaration</th>
            <th>Vehicle</th>
            <th>Store</th>
            <th>Way Bill No</th>
            <th>Pack Number</th>
            <th>Weight</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-discharge>
        <tr>
            <td>{{ discharge.declarationNumber }}</td>
            <td>{{ discharge.vehicleNumber }}</td>
            <td>{{ discharge.storeName }}</td>
            <td>{{ discharge.wayBillNo }}</td>
            <td>{{ discharge.packNumber }}</td>
            <td>{{ discharge.weight }}</td>
            <td>{{ discharge.dischargeDate }}</td>
            <td>
                <!-- <button pButton pRipple type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text"
                    (click)="onEdit(discharge.id)">
                </button> -->
                <button pButton pRipple type="button" icon="pi pi-times"
                    class="p-button-rounded p-button-text p-button-danger" (click)="onDelete($event,discharge.id)">
                </button>
            </td>
        </tr>
    </ng-template>
</p-table>
<p-toast />
<p-confirmDialog />
