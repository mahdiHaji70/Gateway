<div class="p-fluid p-formgrid grid">
    <div class="col-12 group-box">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" ngNativeValidate>
            <div class="grid">
                <div class="col-12 md:col-6 lg:col-4">
                    <app-drop-down [options]="declarations" [formGroup]="form" [controlName]="'declaration'"
                        [required]="true" (change)="loadDischarges($event)">
                    </app-drop-down>
                </div>
            </div>
            <p-table [value]="sendDischarges" styleClass="p-datatable-gridlines"
                [tableStyle]="{ 'min-width': '50rem' }">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Vehicle</th>
                        <th>Store</th>
                        <th>Way Bill No</th>
                        <th>Pack Number</th>
                        <th>Weight</th>
                        <th>Date</th>
                        <th>Is Send</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-discharge>
                    <tr>
                        <td>{{ discharge.vehicleNumber }}</td>
                        <td>{{ discharge.storeName }}</td>
                        <td>{{ discharge.wayBillNo }}</td>
                        <td>{{ discharge.packNumber }}</td>
                        <td>{{ discharge.weight }}</td>
                        <td>{{ discharge.dischargeDate | date:'short' }}</td>
                        <td>
                            <i class="pi"
                                [ngClass]="discharge.isSend ? 'pi-check-circle text-green-500' : 'pi-times-circle text-red-500'">
                            </i>
                        </td>
                    </tr>
                    <tr *ngIf="discharge.sendError">
                        <td colspan="7" class="p-2">
                            <div class="p-message p-message-error w-full">
                                <div class="p-message-wrapper">
                                    <span class="p-message-icon pi pi-exclamation-triangle"></span>
                                    <span class="p-message-text">{{ discharge.sendError }}</span>
                                </div>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>

            <div class="col-12 md:col-6 lg:col-4 flex justify-self-center mt-3" style="justify-self: center;">
                <button pButton type="submit" label="Send" icon="pi pi-send" [disabled]="form.invalid">
                </button>
            </div>
        </form>
    </div>
</div>
<p-toast />
