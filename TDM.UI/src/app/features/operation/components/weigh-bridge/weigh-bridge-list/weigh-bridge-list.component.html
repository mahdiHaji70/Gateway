<p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
        <p-button severity="success" label="New" icon="pi pi-plus" class="mr-2" (onClick)="onAdd()" />
        <p-button severity="info" label="Refresh" icon="pi pi-refresh" class="mr-2" (onClick)="loadWeighBridges()" />
    </ng-template>

</p-toolbar>
<p-table [value]="weighBridges" styleClass="p-datatable-gridlines" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
        <tr>
            <th>Declaration</th>
            <th>Vehicle</th>
            <th>Gross Weight</th>
            <th>Tare Weight</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Actions</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-weighBridge>
        <tr>
            <td>{{ weighBridge.declarationNumber }}</td>
            <td>{{ weighBridge.vehicleName }}</td>
            <td>{{ weighBridge.grossWeight }}</td>
            <td>{{ weighBridge.tareWeight }}</td>
            <td>{{ weighBridge.startDate }}</td>
            <td>{{ weighBridge.endDate }}</td>
            <td>
                <button pButton pRipple type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text"
                    (click)="onEdit(weighBridge.id)">
                </button>
                <button pButton pRipple type="button" icon="pi pi-times"
                    class="p-button-rounded p-button-text p-button-danger" (click)="onDelete($event,weighBridge.id)">
                </button>
            </td>
        </tr>
    </ng-template>
</p-table>
<p-toast />
<p-confirmDialog />
