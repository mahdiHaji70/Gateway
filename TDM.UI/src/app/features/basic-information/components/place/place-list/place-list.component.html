<p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
        <p-button 
            severity="success" 
            label="New" 
            icon="pi pi-plus" 
            class="mr-2" 
            (onClick)="onAdd()" />
            <p-button 
            severity="info" 
            label="Refresh" 
            icon="pi pi-refresh" 
            class="mr-2" 
            (onClick)="loadPlaces()" />
    </ng-template>

</p-toolbar>
<p-table [value]="places" styleClass="p-datatable-gridlines" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
        <tr>
            <th>Place Type</th>
            <th>Place Name</th>
            <th>Capacity</th>
            <th>Area</th>
            <th>Contact</th>            
            <th>Actions</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-place>
        <tr>
            <td>{{ place.placeType }}</td>
            <td>{{ place.placeName }}</td>
            <td>{{ place.capacity }}</td>
            <td>{{ place.area }}</td>
            <td>{{ place.contactName }}</td>
            <td>
                <button pButton pRipple type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text"
                    (click)="onEdit(place.id)">
                </button>
                <button pButton pRipple type="button" icon="pi pi-times"
                    class="p-button-rounded p-button-text p-button-danger" (click)="onDelete($event,place.id)">
                </button>
            </td>
        </tr>
    </ng-template>
</p-table>
<p-toast />
<p-confirmDialog />
