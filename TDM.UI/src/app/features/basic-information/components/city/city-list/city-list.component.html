<p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
        <p-button 
            severity="success" 
            label="New" 
            icon="pi pi-plus" 
            class="mr-2" 
            (onClick)="onAdd()" />
            <p-button 
            severity="info" 
            label="Refresh" 
            icon="pi pi-refresh" 
            class="mr-2" 
            (onClick)="loadCities()" />
    </ng-template>
    <ng-template pTemplate="right">
        <input type="text" class="p-inputtext p-component" placeholder="Search" [(ngModel)]="search" (keyup.enter)="onSearch()" />
        <p-button severity="secondary" label="Search" icon="pi pi-search" class="ml-2" (onClick)="onSearch()" />
    </ng-template>

</p-toolbar>
<p-table [value]="cities" styleClass="p-datatable-gridlines" [tableStyle]="{ 'min-width': '50rem' }"
    [lazy]="true"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="totalRecords"
    [rowsPerPageOptions]="[10, 20, 50]"
    (onLazyLoad)="onPageChange($event)">
    <ng-template pTemplate="header">
        <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Country</th>
            <th>Actions</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-city>
        <tr>
            <td>{{ city.code }}</td>
            <td>{{ city.name }}</td>
            <td>{{ city.countryName }}</td>
            <td>
                <button pButton pRipple type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text"
                    (click)="onEdit(city.id)">
                </button>
                <button pButton pRipple type="button" icon="pi pi-times"
                    class="p-button-rounded p-button-text p-button-danger" (click)="onDelete($event,city.id)">
                </button>
            </td>
        </tr>
    </ng-template>
</p-table>
<p-toast />
<p-confirmDialog />
