<p-toolbar styleClass="mb-4 basic-information-list-toolbar">
    <ng-template pTemplate="left">
        <p-button 
            severity="success" 
            [label]="'common.new' | translate"
            icon="pi pi-plus" 
            class="mr-2" 
            (onClick)="onAdd()" />
            <p-button 
            severity="info" 
            [label]="'common.refresh' | translate"
            icon="pi pi-refresh" 
            class="mr-2" 
            (onClick)="loadUserTerminals()" />
    </ng-template>
    <ng-template pTemplate="right">
        <input type="text" class="p-inputtext p-component" [placeholder]="'common.search' | translate" [(ngModel)]="search" (keyup.enter)="onSearch()" />
        <p-button severity="secondary" [label]="'common.search' | translate" icon="pi pi-search" class="ml-2" (onClick)="onSearch()" />
    </ng-template>

</p-toolbar>
<p-table [value]="userTerminals" styleClass="p-datatable-gridlines"
    [lazy]="true"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="totalRecords"
    [rowsPerPageOptions]="[10, 20, 50]"
    (onLazyLoad)="onPageChange($event)">
    <ng-template pTemplate="header">
        <tr>
            <th>{{ 'fields.nationalId' | translate }}</th>
            <th>{{ 'fields.terminalName' | translate }}</th>
            <th>{{ 'fields.terminalCode' | translate }}</th>
            <th>{{ 'common.actions' | translate }}</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-city>
        <tr>
            <td>{{ city.userNationalId }}</td>
            <td>{{ city.terminalName }}</td>
            <td>{{ city.terminalCode }}</td>
            <td>
                <button pButton pRipple type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text"
                    (click)="onEdit(city.id)">
                </button>
                <button pButton pRipple type="button" icon="pi pi-times"
                    class="p-button-rounded p-button-text p-button-danger" (click)="onDelete($event,city.id)">
                </button>
            </td>
        </tr>
    </ng-template>
</p-table>
<p-toast />
<p-confirmDialog />
