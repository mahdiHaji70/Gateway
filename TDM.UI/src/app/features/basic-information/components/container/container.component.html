<div class="col-4 group-box">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <app-drop-down [options]="containerTypesAndSizes" [formGroup]="form" [controlName]="'containerTypeAndSize'" [labelKey]="'fields.containerTypeAndSize'"
            (filterChange)="onContainerTypeAndSizeFilterChanged($event)"
            (clearEvent)="onContainerTypeAndSizeFilterChanged($event)"
            [required]="true" [optionLabel]="'typeAndSize'"></app-drop-down>
        <app-input [formGroup]="form" [controlName]="'containerNumber'" [labelKey]="'fields.containerNumber'" [required]="true"></app-input>

        <div>
            <button pButton type="submit" [label]="(id != undefined || id != null ? 'common.update' : 'common.add') | translate" icon="fa-plus"
                [disabled]="form.invalid"></button>
        </div>
    </form>
</div>
<p-toast></p-toast>
