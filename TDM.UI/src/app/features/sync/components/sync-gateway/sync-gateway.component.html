<p-card [header]="'sync.title' | translate" class="sync-dashboard">
    @for (syncButton of syncButtons; track $index) {
    <!-- Integration Row 1 -->
    <div class="sync-row">
        <div class="sync-info">
            <span class="sync-label">{{ ('sync.integration.' + syncButton.api) | translate }}</span>
            <span class="sync-status"><p-tag [severity]="syncButton.severity"
                    [value]="syncButton.severity == 'success' ? ('sync.synced' | translate) : syncButton.severity == 'warning' ? ('sync.waiting' | translate) : ('sync.failed' | translate)"></p-tag></span>
            <span class="sync-status"><p-tag [severity]="syncButton.severity"
                    [value]="syncLastDateLabel(syncButton)"></p-tag></span>
        </div>
        <p-button icon="pi pi-refresh" [label]="syncButton.styleClass != 'p-button-danger' ? ('sync.sync' | translate) : ('sync.retry' | translate)"
            [styleClass]="syncButton.styleClass" [loading]="syncButton.loading" [disabled]="syncButton.loading"
            (onClick)="onSync(syncButton)">
        </p-button>
    </div>

    <p-divider></p-divider>

    }
</p-card>

<p-toast />
