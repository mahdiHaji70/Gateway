<div>
    <form class="col-6" [formGroup]="form" (ngSubmit)="onSubmit()" style="justify-self: center;" ngNativeValidate>
        <div class="p-fluid p-formgrid">

            <div class="">
                <app-drop-down [options]="commodities" [formGroup]="form" [controlName]="'commodity'"
                    [required]="true"></app-drop-down>
            </div>

            <div class="">
                <app-drop-down [options]="packages" [formGroup]="form" [controlName]="'package'"
                    [required]="true"></app-drop-down>
            </div>

            <div class="grid">
                <div class="col-6">
                    <app-input-number [formGroup]="form" [controlName]="'packNumber'"
                        [required]="true"></app-input-number>
                </div>

                <div class="col-6">
                    <app-input-number [formGroup]="form" [controlName]="'weight'" [required]="true"></app-input-number>
                </div>
            </div>

            <div class="mt-2">
                <button pButton type="submit"
                    [label]="id != undefined || id != null ? 'Update container info' : 'Add container info'"
                    icon="fa-plus" [disabled]="form.invalid"></button>
            </div>
        </div>
    </form>

    <div class="mt-4">
        <p-table [value]="declarationContainerInfos" styleClass="p-datatable-gridlines"
            [tableStyle]="{ 'min-width': '5rem' }">
            <ng-template pTemplate="header">
                <tr>
                    <th>Commodity</th>
                    <th>Package</th>
                    <th>Pack number</th>
                    <th>Weight</th>
                    <th>Actions</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-declarationContainerInfo>
                <tr>
                    <td>{{ declarationContainerInfo.commodityName }}</td>
                    <td>{{ declarationContainerInfo.packageName }}</td>
                    <td>{{ declarationContainerInfo.packNumber }}</td>
                    <td>{{ declarationContainerInfo.weight }}</td>
                    <td>
                        <button pButton pRipple type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text"
                            title="Edit" (click)="onInfoEdit(declarationContainerInfo)">
                        </button>
                        <button pButton pRipple type="button" icon="pi pi-times" title="Delete"
                            class="p-button-rounded p-button-text p-button-danger" (click)="onInfoDelete($event,declarationContainerInfo.id)">
                        </button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

</div>
