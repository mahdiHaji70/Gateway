<div class="field" [formGroup]="formGroup">
    <label [for]="controlName">{{ label }}</label>
    <p-inputNumber [formControlName]="controlName" type="text" [required]="required" />
    <div *ngIf="formGroup.controls[controlName].errors?.['required'] && formGroup.controls[controlName]?.touched" class="text-red-500 text-sm font-medium m-1">{{label + ' is required'}}</div>    
</div>
