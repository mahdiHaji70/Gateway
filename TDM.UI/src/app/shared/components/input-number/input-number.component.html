<div class="field" [formGroup]="formGroup">
    <label [for]="controlName">{{ labelKey ? (labelKey | translate) : label }}</label>
    <p-inputNumber [formControlName]="controlName" type="text" [required]="required" />
    <div *ngIf="formGroup.controls[controlName].errors?.['required'] && formGroup.controls[controlName]?.touched" class="text-red-500 text-sm font-medium m-1">{{ labelKey ? ('validation.required' | translate: { field: (labelKey | translate) }) : (label + ' is required') }}</div>
</div>
